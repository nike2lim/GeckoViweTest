# Gradle 빌드 데몬에 넘길 JVM 옵션.
# GeckoView AAR이 229.5 MiB이고 매니페스트 병합 대상 <service>가 89개라 기본 힙(512m)으로는 부족할 수 있다.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# 서로 의존하지 않는 태스크를 동시에 실행한다.
org.gradle.parallel=true

# AndroidX 라이브러리를 쓴다는 선언. 구형 support 라이브러리와의 공존을 끄는 스위치다.
android.useAndroidX=true

# Kotlin 컴파일 결과를 JVM 몇 버전용으로 낼지는 app/build.gradle.kts에서 정한다.
# 여기에 org.gradle.java.home을 절대 넣지 않는다 — 머신 고유 절대경로라 다른 환경에서 빌드가 깨진다.
# 대신 모든 Gradle 호출 앞에 JAVA_HOME 환경변수를 붙인다(plan.md R-02).

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
