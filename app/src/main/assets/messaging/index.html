<!DOCTYPE html>
<!--
  브리지 동작을 눈으로 확인하기 위한 내장 테스트 페이지(REQ-007).
  앱을 실행하면 별도 조작 없이 이 페이지가 뜬다.

  이 파일은 확장 폴더 안에 있고 web_accessible_resources에 등록되어 있어
  moz-extension:// 오리진의 "확장 페이지"로 열린다.
  (여기 보이는 텍스트는 웹 리소스라서 안드로이드 strings.xml 대상이 아니다 — plan.md D-13)
-->
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>네이티브 브리지 테스트</title>
  <style>
    body { font-family: sans-serif; margin: 16px; font-size: 16px; }
    h1 { font-size: 20px; }
    button { display: block; width: 100%; padding: 14px; margin: 8px 0; font-size: 16px; }
    #result { margin-top: 16px; padding: 12px; border: 1px solid #999; min-height: 24px; word-break: break-all; }
    #bridgeStatus { color: #060; font-weight: bold; }
  </style>
</head>
<body>
  <h1>네이티브 브리지 테스트</h1>

  <!--
    이 두 줄은 JS가 채운다. 정적 HTML만 그려지고 JS가 죽은 상태를 걸러내기 위한 것이다(AC-007-3).
    처음 값이 그대로 남아 있으면 JS가 실행되지 않았다는 뜻이다.
  -->
  <p>브리지 상태: <span id="bridgeStatus">(JS 미실행)</span></p>

  <button id="btnVersion">getVersionName 호출</button>
  <button id="btnUnknown">없는 함수 호출 (오류 경로 확인)</button>
  <button id="btnFinish">appFinish 호출 (앱 종료)</button>

  <div id="result">결과가 여기에 표시된다</div>

  <!--
    스크립트는 반드시 **외부 파일**이어야 한다.
    확장 페이지에는 기본 CSP `script-src 'self'`가 걸려 있어 인라인 <script>는 실행되지 않는다.
    자세한 근거는 index-page.js 상단 주석에 있다.
  -->
  <script src="bridge-client.js"></script>
  <script src="index-page.js"></script>
</body>
</html>
